# ─────────────────────────────────────────────────────────────
#  laoliang 自动部署 (纯静态站点)
#  触发: push 到 main 分支
#  方式: rsync 同步静态文件到服务器 /data/laoliang, 然后 reload nginx
#
#  需要的 Secrets (仓库 Settings → Secrets and variables → Actions):
#   - DEPLOY_SSH_KEY   : 部署专用 SSH 私钥 (ed25519, 本地生成的那把)
#   - SSH_HOST_KEY     : 服务器 host key (ssh-keyscan 输出, 见 deploy/README-DEPLOY.md)
#   - DEPLOY_HOST      : 服务器 IP/域名 (必填, 不入仓库)
#   - DEPLOY_USER      : SSH 用户 (可选, 默认 ubuntu)
#   - SSH_PORT         : SSH 端口 (可选, 默认 22)
#
#  服务器侧准备见 deploy/README-DEPLOY.md, 已一次性配好。
# ─────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}  # 允许手动触发

concurrency:
  group: deploy-laoliang
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key & known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 私钥
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # host key (避免交互式 yes/no)
          echo "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync static files to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='output' \
            --exclude='.playwright-cli' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}:/data/laoliang/

      - name: Reload nginx on server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }} \
            'sudo nginx -t && sudo systemctl reload nginx'

      - name: Verify deployment
        run: |
          echo "=== 验证 HTTPS 访问 ==="
          curl -fsSI --connect-timeout 15 https://laoliang.youyongai.com/ | head -5
          echo "=== 部署完成 ✓ ==="
