# ─────────────────────────────────────────────────────────────
#  laoliang 自动部署
#  触发: push main / 手动 (仅部署站点，不再承担价格刷新)
#  服务器保持纯 Nginx 静态托管，不依赖 Node 或浏览器运行时
#  注: 价格刷新完全由服务器本地 systemd timer laoliang-pricing.timer (每5分钟) 负责,
#      CI 不再跑定时 schedule (公开仓库 schedule 触发不可靠, 且与服务器 timer 冗余)
#
#  需要的 Secrets (仓库 Settings → Secrets and variables → Actions):
#   - DEPLOY_SSH_KEY   : 部署专用 SSH 私钥 (ed25519, 本地生成的那把)
#   - SSH_HOST_KEY     : 服务器 host key (ssh-keyscan 输出, 见 deploy/README-DEPLOY.md)
#   - DEPLOY_HOST      : 服务器 IP/域名 (必填, 不入仓库)
#   - DEPLOY_USER      : 低权限部署用户 (必填, 不使用管理员账户)
#   - SSH_PORT         : SSH 端口 (可选, 默认 22)
#
#  服务器侧准备见 deploy/README-DEPLOY.md, 已一次性配好。
# ─────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-laoliang
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Test pricing parser
        run: node --test server.test.js

      - name: Fetch official pricing
        run: node scripts/update-pricing.js

      - name: Inject build hash for cache busting
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Injecting build hash: $SHORT_SHA"
          sed -i "s/__BUILD_HASH__/$SHORT_SHA/g" index.html
          grep -q "$SHORT_SHA" index.html && echo "✓ index.html 已注入版本指纹"

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST Secret 未配置"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "DEPLOY_USER Secret 未配置"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY Secret 未配置"; exit 1; }
          test -n "$SSH_HOST_KEY" || { echo "SSH_HOST_KEY Secret 未配置"; exit 1; }

      - name: Install SSH key & known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync website to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='output' \
            --exclude='.playwright-cli' \
            --exclude='scripts' \
            --exclude='server.js' \
            --exclude='server.test.js' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:/data/laoliang/"

      - name: Reload nginx
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /usr/sbin/nginx -t && sudo /usr/bin/systemctl reload nginx'

      - name: Verify deployment
        run: |
          curl -fsS --retry 4 --retry-delay 3 \
            "https://laoliang.youyongai.com/?build=${GITHUB_SHA}" \
            | grep -q 'DeepSeek 实时价格'
          curl -fsS --retry 4 --retry-delay 3 \
            "https://laoliang.youyongai.com/api/pricing.json?build=${GITHUB_RUN_ID}" \
            > /tmp/pricing.json
          node -e '
            const payload = require("/tmp/pricing.json");
            const flash = payload.models?.["deepseek-v4-flash"];
            const pro = payload.models?.["deepseek-v4-pro"];
            if (![flash?.input, flash?.output, pro?.input, pro?.output].every(Number.isFinite)) process.exit(1);
            console.log(`线上验证通过：Flash ${flash.input}/${flash.output}，Pro ${pro.input}/${pro.output}`);
          '

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
