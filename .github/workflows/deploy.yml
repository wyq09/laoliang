# ─────────────────────────────────────────────────────────────
#  laoliang 自动部署 + 定价同步
#  触发: push main / 手动 / 每 5 分钟同步一次官方价格
#  服务器保持纯 Nginx 静态托管，不依赖 Node 或浏览器运行时
#
#  需要的 Secrets (仓库 Settings → Secrets and variables → Actions):
#   - DEPLOY_SSH_KEY   : 部署专用 SSH 私钥 (ed25519, 本地生成的那把)
#   - SSH_HOST_KEY     : 服务器 host key (ssh-keyscan 输出, 见 deploy/README-DEPLOY.md)
#   - DEPLOY_HOST      : 服务器 IP/域名 (必填, 不入仓库)
#   - DEPLOY_USER      : SSH 用户 (可选, 默认 ubuntu)
#   - SSH_PORT         : SSH 端口 (可选, 默认 22)
#
#  服务器侧准备见 deploy/README-DEPLOY.md, 已一次性配好。
# ─────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: deploy-laoliang
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test pricing parser
        run: node --test server.test.js

      - name: Fetch official pricing
        run: node scripts/update-pricing.js

      - name: Inject build hash for cache busting
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "Injecting build hash: $SHORT_SHA"
          sed -i "s/__BUILD_HASH__/$SHORT_SHA/g" index.html
          grep -q "$SHORT_SHA" index.html && echo "✓ index.html 已注入版本指纹"

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "DEPLOY_HOST Secret 未配置"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY Secret 未配置"; exit 1; }
          test -n "$SSH_HOST_KEY" || { echo "SSH_HOST_KEY Secret 未配置"; exit 1; }

      - name: Install SSH key & known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 私钥
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # host key (避免交互式 yes/no)
          echo "${{ secrets.SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync website to server
        if: github.event_name != 'schedule'
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='deploy' \
            --exclude='README.md' \
            --exclude='.gitignore' \
            --exclude='output' \
            --exclude='.playwright-cli' \
            --exclude='scripts' \
            --exclude='server.js' \
            --exclude='server.test.js' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}:/data/laoliang/

      - name: Sync latest pricing only
        if: github.event_name == 'schedule'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }} \
            'mkdir -p /data/laoliang/api'
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            api/ \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }}:/data/laoliang/api/

      - name: Reload nginx
        if: github.event_name != 'schedule'
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} \
            ${{ secrets.DEPLOY_USER || 'ubuntu' }}@${{ secrets.DEPLOY_HOST }} \
            'sudo nginx -t && sudo systemctl reload nginx'

      - name: Verify deployment
        run: |
          curl -fsS --retry 4 --retry-delay 3 \
            "https://laoliang.youyongai.com/?build=${GITHUB_SHA}" \
            | grep -q 'DeepSeek 实时价格'
          curl -fsS --retry 4 --retry-delay 3 \
            "https://laoliang.youyongai.com/api/pricing.json?build=${GITHUB_RUN_ID}" \
            > /tmp/pricing.json
          node -e '
            const payload = require("/tmp/pricing.json");
            const flash = payload.models?.["deepseek-v4-flash"];
            const pro = payload.models?.["deepseek-v4-pro"];
            if (![flash?.input, flash?.output, pro?.input, pro?.output].every(Number.isFinite)) process.exit(1);
            console.log(`线上验证通过：Flash ${flash.input}/${flash.output}，Pro ${pro.input}/${pro.output}`);
          '
